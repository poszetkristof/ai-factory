human_gate_policy:
  # The line stops and a person decides. Record the gate, do not route around it.
  stop_when:
    - a subagent tries to accept a risk without named human approval
    - a subagent chooses scope beyond factory/feature.md
    - a subagent asks for secrets, credentials, client-confidential or production data
    - a subagent needs a policy, compliance, budget or release decision
    - a subagent proposes spending money or deploying anything
    - a subagent proposes a new tool the model may call
    - a subagent's output would contradict an accepted ADR
    # The "lethal trifecta". Any two are usually fine; all three together are the dangerous shape.
    - a subagent holds private project data, reads untrusted outside content, and has a way to send
      data out

  # Recorded in factory/runs/<slug>/human-gates.md with one of these statuses.
  statuses:
    - recorded-open # gate fired, decision still with the human, line continued on a stated assumption
    - hard-stop # gate fired, line cannot continue until answered
    - paused-approved # human answered, line resumed
    - paused-blocked # human answered "no", scope changed
    - missed # gate should have fired and did not — a finding, same weight as a broken seam
    - n/a # gate does not apply to this subagent

seam_labels:
  - clean # the next subagent got what it needed
  - under-supply # got less than it needed
  - over-supply # got more than it needed; scope crept
  - missing # the file was not there
  - routing # went to the wrong subagent
