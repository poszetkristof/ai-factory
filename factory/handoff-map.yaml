# SOURCE OF TRUTH — the order the line runs in, and who may read whose output.
#
# A subagent reads ONLY the files listed under its `reads:` key. That is the point: a gap upstream
# becomes a visible stop, not a silently invented guess.
#
# Run order is ROLE order, not numeric order. Infra runs before Security because Security reviews
# the infra surface. QA runs last because a real test plan needs the engineering, infra and
# security outputs already written.
#
# {feature} is the run slug, from the `**Run slug:**` line in the project's factory/feature.md.
# It looks like `001-photo-assessment`. The scripts resolve it; a role substitutes it by reading
# that line. Every role whose paths contain {feature} therefore has factory/feature.md in its reads.
#
# A path WITH {feature} is written fresh each run and belongs to one feature. A path WITHOUT it
# belongs to the product and is extended by later runs. See subagent-registry.yaml for the split.

version: 1

execution_order:
  - "100-consulting"
  - "200-product"
  - "300-design"
  - "400-architecture"
  - "500-engineering"
  - "800-infra"
  - "900-security"
  - "600-qa"

# Every run starts from the same two files. They are the only context that is not produced by
# an upstream subagent.
run_inputs:
  - factory/feature.md
  - initial-plan.md

reads:
  "100-consulting":
    - factory/feature.md
    - initial-plan.md

  "200-product":
    - factory/feature.md
    - docs/100-consulting/00-context-brief.md
    - docs/100-consulting/01-use-cases.md
    - docs/100-consulting/03-market.md

  "300-design":
    - factory/feature.md
    - docs/100-consulting/00-context-brief.md
    - "docs/200-product/{feature}/00-prd.md"
    - "docs/200-product/{feature}/01-user-stories.md"

  "400-architecture":
    - factory/feature.md
    - docs/100-consulting/00-context-brief.md
    - "docs/200-product/{feature}/00-prd.md"
    - "docs/200-product/{feature}/01-user-stories.md"
    - "docs/300-design/{feature}/01-CONTEXT.md"
    - "docs/300-design/{feature}/02-SPEC.md"

  "500-engineering":
    # Needed for the run slug: this role writes flat files but reads per-feature ones.
    - factory/feature.md
    # 00-prd.md holds the closed lists — the verdict codes live in its section 5.2, and this role
    # writes them into the contracts package. Added 2026-08-26: without it the role correctly
    # refused to invent eight codes and left the contract unfinished.
    - "docs/200-product/{feature}/00-prd.md"
    - "docs/200-product/{feature}/01-user-stories.md"
    - "docs/300-design/{feature}/02-SPEC.md"
    - docs/300-design/03-tokens.md
    - docs/400-architecture/00-options.md
    - docs/400-architecture/02-containers.mmd
    # 05-patterns.md is named by four ADRs as the authority for the key shapes, the cookie
    # attributes, the answer schema and the failure names. A role that must obey those ADRs has to
    # be able to read the file they point at. Added 2026-08-26.
    - docs/400-architecture/05-patterns.md
    - docs/400-architecture/06-nfrs.md
    - docs/ADR/

  "800-infra":
    - docs/400-architecture/00-options.md
    - docs/400-architecture/02-containers.mmd
    - docs/400-architecture/06-nfrs.md
    - docs/500-engineering/03-api-spec.md
    - docs/ADR/

  "900-security":
    # Needed for the run slug: this role writes flat files but reads the feature's timed flow.
    - factory/feature.md
    - docs/400-architecture/02-containers.mmd
    # 05-patterns.md holds the cookie attributes, the key design and the permission shape. That is
    # this role's whole surface. Added 2026-08-26.
    - docs/400-architecture/05-patterns.md
    - "docs/400-architecture/{feature}/03-flow.md"
    # This role's own contract says "check the sign-in ADR against current guidance and say whether
    # it still holds". It could not read a single ADR. Added 2026-08-26 — the sharpest wiring bug
    # found on run 1, because the instruction and the inputs contradicted each other.
    - docs/ADR/
    - docs/500-engineering/01-contracts.md
    - docs/500-engineering/03-api-spec.md
    - docs/800-infra/00-environments.md
    - docs/800-infra/01-iac-plan.md

  "600-qa":
    # Needed for the run slug, because every file this role writes is per-feature.
    - factory/feature.md
    # This role's contract asks for "a golden set with expected verdicts". The verdict codes are a
    # closed list in 00-prd.md section 5.2. Added 2026-08-26 — it was asked for a golden set of
    # values it could not read.
    - "docs/200-product/{feature}/00-prd.md"
    - "docs/200-product/{feature}/01-user-stories.md"
    # 06-nfrs.md points at metric ids "M-nn" in its last column and names 02-traceability.md as
    # where they live. Without it, every M-nn this role reads is a pointer it cannot follow.
    - "docs/200-product/{feature}/02-traceability.md"
    - "docs/300-design/{feature}/02-SPEC.md"
    - docs/400-architecture/06-nfrs.md
    # NFR-01 and NFR-07 are timing budgets. This file is where the milliseconds were spent, and it
    # marks which of them are guesses. A perf test written without it asserts a number with no source.
    - "docs/400-architecture/{feature}/03-flow.md"
    # The schemas and the failure codes a test case asserts against. Added 2026-08-26.
    - docs/500-engineering/01-contracts.md
    - docs/500-engineering/02-web-spec.md
    - docs/500-engineering/03-api-spec.md
    - docs/800-infra/04-ci-cd.md
    # 02-mitigations.md references threats by id throughout. This is what those ids mean.
    - docs/900-security/01-threats.md
    - docs/900-security/02-mitigations.md
    # The largest single input this role has. 36 checks, each with the exact command, the real input,
    # what counts as a pass and what counts as a fail. Its own header says "Read next by 600 QA" and
    # the map did not give it. Without it this role writes test cases that duplicate or contradict
    # checks that already exist.
    - "docs/900-security/{feature}/03-evidence.md"

# Named edges. One line per file crossing from one subagent to the next. This is the list the seam
# review walks: each edge is marked clean / under-supply / over-supply / missing / routing.
