  - { from: "100-consulting", to: "200-product", file: "docs/100-consulting/01-use-cases.md" }
  - { from: "100-consulting", to: "200-product", file: "docs/100-consulting/03-market.md" }
  - { from: "100-consulting", to: "300-design", file: "docs/100-consulting/00-context-brief.md" }
  - { from: "100-consulting", to: "400-architecture", file: "docs/100-consulting/00-context-brief.md" }
  - { from: "200-product", to: "300-design", file: "docs/200-product/{feature}/00-prd.md" }
  - { from: "200-product", to: "300-design", file: "docs/200-product/{feature}/01-user-stories.md" }
  - { from: "200-product", to: "400-architecture", file: "docs/200-product/{feature}/00-prd.md" }
  - { from: "200-product", to: "400-architecture", file: "docs/200-product/{feature}/01-user-stories.md" }
  - { from: "200-product", to: "500-engineering", file: "docs/200-product/{feature}/00-prd.md" }
  - { from: "200-product", to: "500-engineering", file: "docs/200-product/{feature}/01-user-stories.md" }
  - { from: "200-product", to: "600-qa", file: "docs/200-product/{feature}/00-prd.md" }
  - { from: "200-product", to: "600-qa", file: "docs/200-product/{feature}/01-user-stories.md" }
  - { from: "200-product", to: "600-qa", file: "docs/200-product/{feature}/02-traceability.md" }
  - { from: "300-design", to: "400-architecture", file: "docs/300-design/{feature}/01-CONTEXT.md" }
  - { from: "300-design", to: "400-architecture", file: "docs/300-design/{feature}/02-SPEC.md" }
  - { from: "300-design", to: "500-engineering", file: "docs/300-design/{feature}/02-SPEC.md" }
  - { from: "300-design", to: "500-engineering", file: "docs/300-design/03-tokens.md" }
  - { from: "300-design", to: "600-qa", file: "docs/300-design/{feature}/02-SPEC.md" }
  - { from: "400-architecture", to: "500-engineering", file: "docs/400-architecture/00-options.md" }
  - { from: "400-architecture", to: "500-engineering", file: "docs/400-architecture/02-containers.mmd" }
  - { from: "400-architecture", to: "500-engineering", file: "docs/400-architecture/05-patterns.md" }
  - { from: "400-architecture", to: "500-engineering", file: "docs/400-architecture/06-nfrs.md" }
  - { from: "400-architecture", to: "800-infra", file: "docs/400-architecture/00-options.md" }
  - { from: "400-architecture", to: "800-infra", file: "docs/400-architecture/02-containers.mmd" }
  - { from: "400-architecture", to: "800-infra", file: "docs/400-architecture/06-nfrs.md" }
  - { from: "400-architecture", to: "900-security", file: "docs/400-architecture/02-containers.mmd" }
  - { from: "400-architecture", to: "900-security", file: "docs/400-architecture/05-patterns.md" }
  - { from: "400-architecture", to: "900-security", file: "docs/400-architecture/{feature}/03-flow.md" }
  - { from: "400-architecture", to: "600-qa", file: "docs/400-architecture/06-nfrs.md" }
  - { from: "400-architecture", to: "600-qa", file: "docs/400-architecture/{feature}/03-flow.md" }
  - { from: "500-engineering", to: "800-infra", file: "docs/500-engineering/03-api-spec.md" }
  - { from: "500-engineering", to: "900-security", file: "docs/500-engineering/01-contracts.md" }
  - { from: "500-engineering", to: "900-security", file: "docs/500-engineering/03-api-spec.md" }
  - { from: "500-engineering", to: "600-qa", file: "docs/500-engineering/01-contracts.md" }
  - { from: "500-engineering", to: "600-qa", file: "docs/500-engineering/02-web-spec.md" }
  - { from: "500-engineering", to: "600-qa", file: "docs/500-engineering/03-api-spec.md" }
  - { from: "800-infra", to: "900-security", file: "docs/800-infra/00-environments.md" }
